# Local container run against the fixture corpus (no AWS credentials needed).
#
#   docker compose up --build
#   MCP_URL=http://127.0.0.1:3000/personal-context MCP_BEARER_TOKEN=local-dev-token \
#     ./scripts/mcp_smoke.sh
#
# For the real corpus, switch the environment to CORPUS_SOURCE=s3 and provide
# CONTEXT_BUCKET + AWS credentials (e.g. via env_file: .env).
services:
  personal-context-mcp:
    container_name: personal-context-mcp
    build:
      context: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - PORT=3000
      - MCP_BEARER_TOKEN=local-dev-token
      - CORPUS_SOURCE=file
      - CORPUS_ROOT=/corpus
    volumes:
      - ./tests/fixtures/enriched:/corpus:ro
