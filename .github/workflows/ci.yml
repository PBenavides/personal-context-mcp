# CI gate. Runs on every PR into main, and again on main after merge so the
# branch's own status is always known.
#
# This workflow needs no credentials: `make verify` runs typecheck, lint, the
# unit suite, and the streamable-HTTP smoke test against the fixture corpus
# (tests/fixtures/enriched), never against S3 or the live droplet.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to the same PR cancels the in-flight run; main is never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  verify:
    name: verify (typecheck, lint, test, smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # typecheck -> lint -> jest -> scripts/mcp_smoke.sh (boots the server on
      # :3999 against fixtures and drives it over real JSON-RPC), plus the
      # leftover-branding grep. Same target you run locally.
      #
      # NB: that grep scans the whole tree, this file included — don't name the
      # forbidden string here or the gate fails on its own CI definition.
      - name: make verify
        run: make verify

  image:
    name: docker build (linux/amd64)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      # Build only — the push happens in deploy.yml after merge. This catches a
      # broken Dockerfile or a dependency that won't install on the production
      # platform while it's still a PR.
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
